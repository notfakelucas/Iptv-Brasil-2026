name: EPG — atualiza o guia ao vivo

# Regenera data/epg.json a partir das fontes XMLTV abertas (epgshare01 BR).
# A cada 6 horas + disparo manual. Arquivo pequeno (~160 KB), mantém o guia atual.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gera o guia (data/epg.json)
        run: python3 -I scripts/build_epg.py data data/epg.json

      - name: Commit se houver mudanças
        run: |
          git config user.name  "mobtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/epg.json
          if git diff --cached --quiet; then
            echo "Guia sem mudanças."
          else
            git commit -m "chore(auto): atualiza guia EPG (agora/a seguir)"
            git push
          fi
