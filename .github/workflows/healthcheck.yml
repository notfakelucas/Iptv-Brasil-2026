name: Health-check e rebuild do catálogo

# Roda o health-check dos links, remove os mortos e reconstrói o catálogo.
# Semanal (domingo 06:00 UTC) + disparo manual pela aba Actions.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dbonline_sample:
        description: 'Quantos links do dbonline amostrar'
        default: '15000'

permissions:
  contents: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Health-check dos links
        env:
          DBONLINE_SAMPLE: ${{ github.event.inputs.dbonline_sample || '15000' }}
          HC_WORKERS: '80'
        run: python3 -I scripts/healthcheck.py data deadlist.json

      - name: Rebuild do catálogo (remove mortos, enriquecimento via cache)
        # Sem TMDB_KEY: usa o tmdb_cache.json versionado (mantém as capas).
        # Para enriquecer títulos novos, adicione o secret TMDB_KEY ao repositório.
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          python3 -I build.py . out_ci
          rm -rf data
          mv out_ci data

      - name: Commit se houver mudanças
        run: |
          git config user.name  "mobtv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data deadlist.json tmdb_cache.json
          if git diff --cached --quiet; then
            echo "Nada mudou — catálogo já está limpo."
          else
            git commit -m "chore(auto): health-check semanal — remove links mortos e reconstrói catálogo"
            git push
          fi
